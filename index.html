<title>noteアポ採点ダッシュボード</title>

<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --panel2: #1d222b;
    --border: #2a313d;
    --text: #e6e9ef;
    --text-dim: #9aa3b2;
    --accent: #4f8cff;
    --good: #2dd4bf;
    --partial: #facc15;
    --bad: #f87171;
    --na: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
  }
  header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 24px;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
  header .meta { color: var(--text-dim); font-size: 12px; }
  main {
    display: grid;
    grid-template-columns: 380px 1fr;
    min-height: calc(100vh - 60px);
  }
  .list-pane {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
  }
  .list-pane h2 {
    margin: 0 0 12px;
    font-size: 12px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .card {
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .card:hover { border-color: #3b4555; background: var(--panel2); }
  .card.active { border-color: var(--accent); background: var(--panel2); }
  .card .title { font-size: 13px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
  .card .row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-dim); }
  .card .score {
    font-size: 22px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .score.good { color: var(--good); }
  .score.partial { color: var(--partial); }
  .score.bad { color: var(--bad); }
  .yes-mini { display: flex; gap: 3px; margin-top: 8px; }
  .yes-mini span {
    width: 22px; height: 16px; font-size: 9px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 3px; font-weight: 600;
    background: var(--panel2); border: 1px solid var(--border);
  }
  .yes-mini .achieved { background: rgba(45,212,191,0.15); color: var(--good); border-color: rgba(45,212,191,0.3); }
  .yes-mini .partial { background: rgba(250,204,21,0.15); color: var(--partial); border-color: rgba(250,204,21,0.3); }
  .yes-mini .failed { background: rgba(248,113,113,0.15); color: var(--bad); border-color: rgba(248,113,113,0.3); }
  .yes-mini .na { color: var(--na); }

  .detail-pane {
    padding: 24px 32px;
    overflow-y: auto;
  }
  .detail-pane .empty { color: var(--text-dim); text-align: center; padding: 80px 0; }

  .summary-block {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 20px;
    align-items: start;
    margin-bottom: 28px;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .big-score { text-align: center; }
  .big-score .num { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .big-score .label { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .big-score .denom { font-size: 12px; color: var(--text-dim); margin-top: 8px; }

  .meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px 20px;
  }
  .meta-item .k { font-size: 11px; color: var(--text-dim); }
  .meta-item .v { font-size: 14px; }

  h2.section-h {
    font-size: 14px; font-weight: 600;
    margin: 28px 0 10px;
    color: var(--text);
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .yes-ladder {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .yes-cell {
    padding: 10px 8px;
    border-radius: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    text-align: center;
  }
  .yes-cell .id { font-size: 11px; color: var(--text-dim); font-weight: 600; }
  .yes-cell .icon { font-size: 18px; margin: 4px 0; }
  .yes-cell .lbl { font-size: 10px; color: var(--text-dim); line-height: 1.3; }
  .yes-cell.achieved { background: rgba(45,212,191,0.08); border-color: rgba(45,212,191,0.3); }
  .yes-cell.achieved .icon { color: var(--good); }
  .yes-cell.partial { background: rgba(250,204,21,0.08); border-color: rgba(250,204,21,0.3); }
  .yes-cell.partial .icon { color: var(--partial); }
  .yes-cell.failed { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.3); }
  .yes-cell.failed .icon { color: var(--bad); }
  .yes-cell.na .icon { color: var(--na); }

  .checklist-section { margin-bottom: 16px; }
  .checklist-section summary {
    cursor: pointer; padding: 10px 14px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    font-weight: 600; font-size: 13px;
    display: flex; justify-content: space-between; align-items: center;
    list-style: none;
  }
  .checklist-section summary::-webkit-details-marker { display: none; }
  .checklist-section summary .stats { font-size: 11px; color: var(--text-dim); font-weight: 400; font-variant-numeric: tabular-nums; }
  .checklist-section[open] summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  .checklist-section .items {
    border: 1px solid var(--border); border-top: none;
    border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;
    background: var(--panel);
    padding: 4px 0;
  }
  .item {
    padding: 10px 14px;
    display: grid;
    grid-template-columns: 28px 1fr auto;
    gap: 12px;
    align-items: start;
    border-top: 1px solid var(--border);
  }
  .item:first-child { border-top: none; }
  .item .judge { font-size: 18px; font-weight: 700; text-align: center; }
  .item.achieved .judge { color: var(--good); }
  .item.partial .judge { color: var(--partial); }
  .item.failed .judge { color: var(--bad); }
  .item.na .judge { color: var(--na); }
  .item .body .lbl { font-size: 13px; font-weight: 500; }
  .item .body .id { font-size: 10px; color: var(--text-dim); font-weight: 600; margin-right: 6px; }
  .item .body .quote {
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--text-dim);
    border-left: 2px solid var(--border);
    padding: 2px 8px;
    background: rgba(0,0,0,0.15);
    border-radius: 0 4px 4px 0;
    line-height: 1.5;
  }
  .item .body .quote .qlabel { color: var(--accent); font-weight: 600; margin-right: 4px; }
  .item .body .comment { font-size: 11.5px; color: var(--text-dim); margin-top: 4px; font-style: italic; }
  .item .score-cell {
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--text-dim);
    text-align: right;
    white-space: nowrap;
  }
  .item .score-cell .gained { font-weight: 600; color: var(--text); }

  .impr-card, .good-card {
    padding: 14px 16px;
    border-radius: 10px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
  }
  .impr-card { border-left: 3px solid var(--bad); }
  .good-card { border-left: 3px solid var(--good); }
  .impr-card .t, .good-card .t { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .impr-card .d, .good-card .d { font-size: 12.5px; color: var(--text-dim); line-height: 1.6; }
  .impr-card .ex {
    margin-top: 8px; padding: 8px 12px;
    background: rgba(79,140,255,0.08);
    border-left: 2px solid var(--accent);
    border-radius: 0 4px 4px 0;
    font-size: 12px;
    line-height: 1.6;
  }
  .impr-card .ex .ex-lbl { color: var(--accent); font-weight: 600; font-size: 10px; display: block; margin-bottom: 2px; }

  ul.phrases { margin: 0; padding-left: 18px; }
  ul.phrases li { font-size: 13px; line-height: 1.8; }

  .na-block { font-size: 12px; color: var(--text-dim); padding: 10px 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  .na-block .id { color: var(--accent); font-weight: 600; }

  .upload-bar { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px dashed var(--border); }
  .upload-btn {
    width: 100%; padding: 11px 14px;
    background: linear-gradient(135deg, #4f8cff 0%, #6366f1 100%);
    border: none; border-radius: 8px; color: white;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s, transform 0.05s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .upload-btn:hover { opacity: 0.92; }
  .upload-btn:active { transform: scale(0.99); }
  .upload-btn:disabled { background: var(--panel2); color: var(--text-dim); cursor: not-allowed; }
  .upload-status {
    font-size: 11px; color: var(--text-dim);
    margin-top: 8px; padding: 6px 10px;
    background: var(--panel2); border-radius: 5px;
    text-align: center;
  }
  .upload-status.ok { color: var(--good); }
  .upload-status.off { color: var(--text-dim); }
  .pending-section { margin-bottom: 16px; }
  .pending-section .lbl { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
  .pending-card {
    padding: 10px 12px; border-radius: 8px;
    background: rgba(79,140,255,0.08); border: 1px dashed rgba(79,140,255,0.4);
    margin-bottom: 6px;
  }
  .pending-card .t { font-size: 12px; font-weight: 600; }
  .pending-card .m { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  .modal-backdrop {
    display: none;
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 100; align-items: center; justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    width: 90%; max-width: 720px; max-height: 90vh; overflow-y: auto;
    padding: 24px;
  }
  .modal h3 { margin: 0 0 16px; font-size: 16px; }
  .modal .field { margin-bottom: 14px; }
  .modal label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  .modal input, .modal textarea {
    width: 100%; padding: 10px 12px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 13px; font-family: inherit;
    box-sizing: border-box;
  }
  .modal textarea { min-height: 240px; resize: vertical; line-height: 1.5; }
  .modal input:focus, .modal textarea:focus { outline: none; border-color: var(--accent); }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal button {
    padding: 9px 18px; border-radius: 6px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border); background: var(--panel2); color: var(--text);
  }
  .modal button.primary { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
  .modal button:hover { opacity: 0.92; }
  .modal .file-drop {
    border: 1px dashed var(--border); border-radius: 6px;
    padding: 12px; text-align: center; font-size: 12px;
    color: var(--text-dim); cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  .modal .file-drop:hover, .modal .file-drop.dragover { border-color: var(--accent); background: rgba(79,140,255,0.05); }
  .modal .helper { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 12px 18px; border-radius: 8px;
    background: var(--panel); border: 1px solid var(--border);
    font-size: 13px; z-index: 200;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    transform: translateY(20px); opacity: 0;
    transition: transform 0.2s, opacity 0.2s;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.ok { border-left: 3px solid var(--good); }
  .toast.err { border-left: 3px solid var(--bad); }
</style>
</head>
<body>
<header>
  <h1>noteアポ採点ダッシュボード</h1>
  <span class="meta" id="lastUpdated"></span>
</header>
<main>
  <aside class="list-pane">
    <div class="upload-bar">
      <button class="upload-btn" id="openUploadBtn">＋ 文字起こしをアップロード</button>
      <div class="upload-status" id="uploadStatus">サーバー検出中…</div>
    </div>
    <div class="pending-section" id="pendingSection" style="display:none;">
      <div class="lbl">採点待ち</div>
      <div id="pendingList"></div>
    </div>
    <h2>評価一覧</h2>
    <div id="cards"></div>
  </aside>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h3>新規 noteインタビューを採点に出す</h3>
      <div class="field">
        <label for="upTitle">タイトル</label>
        <input id="upTitle" placeholder="例：【note】meet_株式会社XX_山田様">
      </div>
      <div class="field" style="display:grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div>
          <label for="upSales">営業担当（任意）</label>
          <input id="upSales" placeholder="例：黒澤優一">
        </div>
        <div>
          <label for="upIntro">紹介者（あれば）</label>
          <input id="upIntro" placeholder="例：新井氏">
        </div>
      </div>
      <div class="field">
        <label for="upText">文字起こし本文</label>
        <textarea id="upText" placeholder="Notta形式の文字起こしをここに貼り付けてください（話者名 HH:MM の繰り返し）"></textarea>
        <div class="file-drop" id="fileDrop">
          または .txt / .md ファイルをドラッグ＆ドロップ（クリックで選択）
          <input type="file" id="fileInput" accept=".txt,.md" style="display:none">
        </div>
        <div class="helper">アップロード後、次回のスケジュール実行（最大30分以内）で自動採点され、一覧に追加されます。</div>
      </div>
      <div class="actions">
        <button id="cancelUploadBtn">キャンセル</button>
        <button class="primary" id="submitUploadBtn">採点に出す</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <section class="detail-pane" id="detail">
    <div class="empty">左の一覧から評価を選択してください</div>
  </section>
</main>

      ],

        "salespersonAffiliation": "One Rep（黒澤優一）",
        "context": "河本（リュウマくん）経由の紹介アポ。加納氏は営業代行・Wi-Fi訪販を運営、駒澤大学休学中（六年生扱い）、岐阜出身・長野＆東京二拠点。冒頭遅刻・雑談から入り、正式な名乗り・時間制約確認・メディア趣旨説明・事業紹介・4-4の論理展開・5.5橋渡し・クロージング全てスキップ。途中で加納氏から「すごい今お若いなと思ったんですけど」「黒澤さんはどこなんですか出身？」「上京して起業しようと思ったきっかけは？」と質問が来て主導権が完全逆転。実質的にはお見合い的な相互紹介ミーティングで終わったが、加納氏のスタンスは終始好意的で、note出演OK／インターン候補紹介依頼／三人サウナ約束／長野県社員候補成約時謝礼10万円提案など、関係構築としてのアウトカムは取れている"

<script>
(async function() {
  let DATA;
  const inline = document.getElementById('data').textContent.trim();
  if (inline && inline !== '__DATA_PLACEHOLDER__') {
    DATA = JSON.parse(inline);
  } else {
    try {
      const res = await fetch('./data/evaluations.json');
      DATA = await res.json();
    } catch (e) {
      document.getElementById('detail').innerHTML = '<div class="empty">データ読み込みエラー: ' + e.message + '<br><br>このページをブラウザで開く時は、同ディレクトリで <code>python3 -m http.server 8765</code> を実行してください。</div>';
      return;
    }
  }
  init(DATA);
})();

function init(DATA) {
  document.getElementById('lastUpdated').textContent = '最終更新: ' + (DATA.lastUpdated || '');
  const evals = DATA.evaluations || [];
  evals.sort((a, b) => (b.evaluatedAt || '').localeCompare(a.evaluatedAt || ''));

  const cardsHost = document.getElementById('cards');
  cardsHost.innerHTML = evals.map((e, i) => renderCard(e, i)).join('');
  cardsHost.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => {
      cardsHost.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderDetail(evals[Number(el.dataset.idx)]);
    });
  });
  if (evals[0]) {
    cardsHost.querySelector('.card').classList.add('active');
    renderDetail(evals[0]);
  }

  setupUpload();
}

let SERVER_AVAILABLE = false;

async function setupUpload() {
  const statusEl = document.getElementById('uploadStatus');
  const btn = document.getElementById('openUploadBtn');
  try {
    const res = await fetch('/api/uploads', { method: 'GET' });
    if (!res.ok) throw new Error('api not ok');
    SERVER_AVAILABLE = true;
    const data = await res.json();
    statusEl.textContent = `サーバー接続OK（採点待ち ${data.uploads.length} 件）`;
    statusEl.className = 'upload-status ok';
    renderPending(data.uploads);
  } catch (e) {
    SERVER_AVAILABLE = false;
    statusEl.textContent = 'オフライン表示（アップロードは server.py 起動時のみ）';
    statusEl.className = 'upload-status off';
    btn.disabled = true;
    btn.textContent = 'アップロード不可（サーバー停止中）';
    return;
  }

  btn.addEventListener('click', () => openUploadModal());
  document.getElementById('cancelUploadBtn').addEventListener('click', closeUploadModal);
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') closeUploadModal();
  });
  document.getElementById('submitUploadBtn').addEventListener('click', submitUpload);

  const fileDrop = document.getElementById('fileDrop');
  const fileInput = document.getElementById('fileInput');
  fileDrop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
  ['dragover','dragleave','drop'].forEach(ev => {
    fileDrop.addEventListener(ev, (e) => {
      e.preventDefault();
      if (ev === 'dragover') fileDrop.classList.add('dragover');
      else fileDrop.classList.remove('dragover');
      if (ev === 'drop' && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
  });
}

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById('upText').value = reader.result;
    if (!document.getElementById('upTitle').value) {
      document.getElementById('upTitle').value = file.name.replace(/\.(txt|md)$/i, '');
    }
  };
  reader.readAsText(file);
}

function openUploadModal() {
  document.getElementById('modal').classList.add('open');
  document.getElementById('upTitle').focus();
}

function closeUploadModal() {
  document.getElementById('modal').classList.remove('open');
}

async function submitUpload() {
  const title = document.getElementById('upTitle').value.trim();
  const salesperson = document.getElementById('upSales').value.trim();
  const introducedBy = document.getElementById('upIntro').value.trim();
  const transcript = document.getElementById('upText').value.trim();
  if (!title) { toast('タイトルを入力してください', 'err'); return; }
  if (!transcript || transcript.length < 200) { toast('文字起こしを200字以上で入力してください', 'err'); return; }

  const btn = document.getElementById('submitUploadBtn');
  btn.disabled = true; btn.textContent = '送信中…';
  try {
    const res = await fetch('/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, salesperson, introducedBy, transcript })
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    toast(`採点キューに追加しました（${data.savedAs}）`, 'ok');
    closeUploadModal();
    // Reset form
    document.getElementById('upTitle').value = '';
    document.getElementById('upSales').value = '';
    document.getElementById('upIntro').value = '';
    document.getElementById('upText').value = '';
    // Refresh pending list
    const list = await fetch('/api/uploads').then(r => r.json());
    renderPending(list.uploads);
    document.getElementById('uploadStatus').textContent = `サーバー接続OK（採点待ち ${list.uploads.length} 件）`;
  } catch (e) {
    toast('エラー: ' + e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = '採点に出す';
  }
}

function renderPending(uploads) {
  const sec = document.getElementById('pendingSection');
  const list = document.getElementById('pendingList');
  if (!uploads || uploads.length === 0) {
    sec.style.display = 'none';
    return;
  }
  sec.style.display = 'block';
  list.innerHTML = uploads.map(u => `
    <div class="pending-card">
      <div class="t">${escapeHtml(u.title || u.filename)}</div>
      <div class="m">${escapeHtml(u.salesperson || '担当未指定')} ・ ${(u.transcriptLen || 0).toLocaleString()}字 ・ ${(u.uploadedAt || '').slice(0, 16)}</div>
    </div>`).join('');
}

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || 'ok');
  setTimeout(() => t.classList.remove('show'), 3500);
}

function scoreClass(score) {
  if (score >= 70) return 'good';
  if (score >= 50) return 'partial';
  return 'bad';
}

function judgeIcon(j) {
  if (j === 'achieved') return '✓';
  if (j === 'partial') return '△';
  if (j === 'failed') return '✗';
  return '–';
}

function renderCard(e, idx) {
  const sc = scoreClass(e.totalScore);
  const yesMini = (e.yesLadder || []).map(y => {
    const cls = y.status;
    return `<span class="${cls}" title="${y.id}: ${y.label}">${y.id}</span>`;
  }).join('');
  return `
    <div class="card" data-idx="${idx}">
      <div class="title">${escapeHtml(e.title)}</div>
      <div class="row">
        <span>${escapeHtml(e.salesperson || '')} ・ ${escapeHtml(e.evaluatedAt || '')}</span>
        <span class="score ${sc}">${e.totalScore}</span>
      </div>
      <div class="yes-mini">${yesMini}</div>
    </div>`;
}

function renderDetail(e) {
  const host = document.getElementById('detail');
  const sc = scoreClass(e.totalScore);

  const meta = [
    ['営業担当', e.salesperson],
    ['面会形式', e.format],
    ['商談時間', e.durationMinutes ? e.durationMinutes + '分' : '-'],
    ['紹介経由', e.introducedBy ? 'はい（' + e.introducedBy + '）' : 'いいえ'],
    ['評価日', e.evaluatedAt],
    ['元Doc', e.driveDocId ? `<a href="https://docs.google.com/document/d/${e.driveDocId}/edit" target="_blank" style="color: var(--accent); text-decoration: none;">Drive で開く ↗</a>` : '-']
  ];

  const yesHtml = (e.yesLadder || []).map(y => `
    <div class="yes-cell ${y.status}" title="${y.naReason || ''}">
      <div class="id">${y.id}</div>
      <div class="icon">${y.status === 'na' ? 'N/A' : judgeIcon(y.status)}</div>
      <div class="lbl">${escapeHtml(y.label)}</div>
    </div>`).join('');

  // group checklist by section
  const groups = {};
  (e.checklist || []).forEach(item => {
    const k = item.section || '';
    if (!groups[k]) groups[k] = [];
    groups[k].push(item);
  });
  const sectionsHtml = Object.entries(groups).map(([sec, items]) => {
    const total = items.reduce((s, x) => s + (x.judgment === 'na' ? 0 : x.weight), 0);
    const gained = items.reduce((s, x) => s + (x.score || 0), 0);
    const naCount = items.filter(x => x.judgment === 'na').length;
    const stats = total > 0 ? `${gained.toFixed(1)} / ${total}` : (naCount ? 'N/A' : '0 / 0');
    const open = items.some(x => x.judgment === 'failed' || x.judgment === 'partial') ? 'open' : '';
    const itemsHtml = items.map(x => `
      <div class="item ${x.judgment}">
        <div class="judge">${x.judgment === 'na' ? 'N/A' : judgeIcon(x.judgment)}</div>
        <div class="body">
          <div class="lbl"><span class="id">${x.id}</span>${escapeHtml(x.label)}</div>
          ${x.scriptQuote ? `<div class="quote"><span class="qlabel">台本</span>${escapeHtml(x.scriptQuote)}</div>` : ''}
          ${x.actualQuote ? `<div class="quote"><span class="qlabel">実発話</span>${escapeHtml(x.actualQuote)}</div>` : ''}
          ${x.comment ? `<div class="comment">${escapeHtml(x.comment)}</div>` : ''}
        </div>
        <div class="score-cell">${x.judgment === 'na' ? 'N/A' : `<span class="gained">${x.score}</span> / ${x.weight}`}</div>
      </div>`).join('');
    return `
      <details class="checklist-section" ${open}>
        <summary><span>${escapeHtml(sec)}</span><span class="stats">${stats}</span></summary>
        <div class="items">${itemsHtml}</div>
      </details>`;
  }).join('');

  const goodHtml = (e.goodPoints || []).map(g => `
    <div class="good-card">
      <div class="t">${escapeHtml(g.title)}</div>
      <div class="d">${escapeHtml(g.detail || '')}</div>
      ${g.evidence ? `<div class="ex"><span class="ex-lbl">根拠</span>${escapeHtml(g.evidence)}</div>` : ''}
    </div>`).join('');

  const imprHtml = (e.improvements || []).map(g => `
    <div class="impr-card">
      <div class="t">${escapeHtml(g.title)}</div>
      <div class="d">${escapeHtml(g.detail || '')}</div>
      ${g.exampleScript ? `<div class="ex"><span class="ex-lbl">次回フレーズ例</span>${escapeHtml(g.exampleScript)}</div>` : ''}
    </div>`).join('');

  const phrasesHtml = (e.extractedPhrases || []).map(p => `<li>${escapeHtml(p)}</li>`).join('');
  const naHtml = (e.naItems || []).map(n => `<div class="na-block"><span class="id">${escapeHtml(n.id)}</span>（${n.weight}点免除）— ${escapeHtml(n.reason)}</div>`).join('');

  host.innerHTML = `
    <div class="summary-block">
      <div class="big-score">
        <div class="num ${sc}">${e.totalScore}</div>
        <div class="label">/ 100 点</div>
        <div class="denom">適用重み ${e.appliedWeight} / ${e.maxWeight}</div>
      </div>
      <div>
        <div style="font-size: 16px; font-weight: 600; margin-bottom: 12px;">${escapeHtml(e.title)}</div>
        <div class="meta-grid">
          ${meta.map(([k, v]) => `<div class="meta-item"><div class="k">${k}</div><div class="v">${v ?? '-'}</div></div>`).join('')}
        </div>
      </div>
    </div>

    <h2 class="section-h">Yesラダー獲得状況</h2>
    <div class="yes-ladder">${yesHtml}</div>

    <h2 class="section-h">スクリプト対比チェックリスト（全${(e.checklist || []).length}項目）</h2>
    ${sectionsHtml}

    <h2 class="section-h">改善点 Top 3</h2>
    ${imprHtml}

    <h2 class="section-h">良かった点 Top 3</h2>
    ${goodHtml}

    <h2 class="section-h">抽出された相手の独自フレーズ</h2>
    <ul class="phrases">${phrasesHtml}</ul>

    ${naHtml ? `<h2 class="section-h">N/A適用項目</h2><div style="display: grid; gap: 6px;">${naHtml}</div>` : ''}
  `;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
